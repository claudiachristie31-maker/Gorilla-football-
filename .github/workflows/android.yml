      - name: Find and extract source
        run: |
          ZIP=$(find . -type f -iname '*Nickoyclient*source*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Source ZIP not found."
            echo "Files currently in repository:"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Found source: $ZIP"
          mkdir -p source
          unzip -o "$ZIP" -d source
          ls -R source
